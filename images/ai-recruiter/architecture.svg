<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de producción de AI Recruiter en AWS</title>
  <desc id="desc">CloudFront entrega el frontend React desde un bucket privado de S3 y envía las rutas API a FastAPI en ECS Fargate. Cognito gestiona identidad; DynamoDB persiste datos; S3 y Bedrock Knowledge Bases procesan los currículos; Amazon Nova Lite genera evaluaciones. GitHub Actions despliega frontend y backend.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071422"/>
      <stop offset="1" stop-color="#0b2033"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10263b" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0c1d2f" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e0cf"/>
      <stop offset="1" stop-color="#72a7ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ed7ce"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72a7ff"/>
    </marker>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="900" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="898" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <text x="72" y="76" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">AI Recruiter · Arquitectura de producción</text>
  <text x="72" y="108" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="15">Entrega estática en el edge · API segura en contenedores · Evaluación RAG con Amazon Bedrock</text>
  <rect x="1190" y="57" width="178" height="42" rx="21" fill="#52e0cf" fill-opacity="0.09" stroke="#52e0cf" stroke-opacity="0.35"/>
  <circle cx="1218" cy="78" r="5" fill="#52e0cf"/>
  <text x="1233" y="83" fill="#52e0cf" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">AWS · us-east-2</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 208 238 H 296" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 470 238 H 558" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 748 218 H 862" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 748 258 H 800 V 389 H 862" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 1058 389 H 1142" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 960 468 V 527" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 960 468 V 500 H 680 V 527" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 960 468 V 500 H 1240 V 527" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 774 592 H 862" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 1058 592 H 1146" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 1146 625 H 1085 V 675 H 1052" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 1320 592 H 1364 V 389 H 1338" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(72 183)">
      <rect width="136" height="110" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="68" cy="36" r="18" fill="#52e0cf" fill-opacity="0.12"/>
      <circle cx="68" cy="31" r="7" fill="none" stroke="#52e0cf" stroke-width="2"/>
      <path d="M 55 53 C 58 43 78 43 81 53" fill="none" stroke="#52e0cf" stroke-width="2"/>
      <text x="68" y="78" text-anchor="middle" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Usuarios</text>
      <text x="68" y="98" text-anchor="middle" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="11">Navegador web</text>
    </g>

    <g transform="translate(296 183)">
      <rect width="174" height="110" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="31" fill="#f59e0b" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DNS</text>
      <text x="20" y="63" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Route 53</text>
      <text x="20" y="86" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">ai.adrianguerra.net</text>
    </g>

    <g transform="translate(558 173)">
      <rect width="190" height="130" rx="20" fill="url(#panel)" stroke="#52e0cf" stroke-opacity="0.42"/>
      <rect x="18" y="18" width="64" height="24" rx="12" fill="#52e0cf" fill-opacity="0.12"/>
      <text x="50" y="34" text-anchor="middle" fill="#52e0cf" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">EDGE</text>
      <text x="18" y="72" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">CloudFront</text>
      <text x="18" y="96" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">CDN · TLS · SPA routing</text>
      <text x="18" y="115" fill="#72a7ff" font-family="Inter, Arial, sans-serif" font-size="11">/api/* → origen HTTPS</text>
    </g>

    <g transform="translate(862 163)">
      <rect width="196" height="130" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="32" fill="#72a7ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">FRONTEND</text>
      <text x="20" y="67" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">React + Vite</text>
      <text x="20" y="91" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Bucket S3 privado</text>
      <text x="20" y="111" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Origin Access Control</text>
    </g>

    <g transform="translate(862 324)">
      <rect width="196" height="144" rx="20" fill="url(#panel)" stroke="#72a7ff" stroke-opacity="0.42"/>
      <text x="20" y="32" fill="#72a7ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">API ORIGIN</text>
      <text x="20" y="67" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Application LB</text>
      <text x="20" y="92" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">HTTPS · ACM</text>
      <text x="20" y="114" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Enrutamiento /api</text>
    </g>

    <g transform="translate(1142 314)">
      <rect width="196" height="154" rx="20" fill="url(#panel)" stroke="#52e0cf" stroke-opacity="0.42"/>
      <text x="20" y="32" fill="#52e0cf" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">COMPUTE</text>
      <text x="20" y="67" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">ECS Fargate</text>
      <text x="20" y="92" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">FastAPI · Python</text>
      <text x="20" y="114" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Docker · Task Role</text>
      <text x="20" y="136" fill="#72a7ff" font-family="Inter, Arial, sans-serif" font-size="11">Amazon Nova Lite</text>
    </g>

    <g transform="translate(584 527)">
      <rect width="190" height="130" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="31" fill="#f59e0b" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">IDENTIDAD</text>
      <text x="20" y="65" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Cognito</text>
      <text x="20" y="90" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Registro · Login</text>
      <text x="20" y="111" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">JWT por usuario</text>
    </g>

    <g transform="translate(862 527)">
      <rect width="196" height="130" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="31" fill="#72a7ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DATOS</text>
      <text x="20" y="65" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">DynamoDB</text>
      <text x="20" y="90" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Vacantes · Candidatos</text>
      <text x="20" y="111" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Evaluaciones · Ranking</text>
    </g>

    <g transform="translate(1146 527)">
      <rect width="174" height="130" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="31" fill="#52e0cf" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DOCUMENTOS</text>
      <text x="20" y="65" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Amazon S3</text>
      <text x="20" y="90" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">CV en PDF</text>
      <text x="20" y="111" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Metadatos de ingesta</text>
    </g>

    <g transform="translate(862 675)">
      <rect width="190" height="126" rx="20" fill="url(#panel)" stroke="#72a7ff" stroke-opacity="0.42"/>
      <text x="20" y="31" fill="#72a7ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">RAG</text>
      <text x="20" y="63" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Bedrock KB</text>
      <text x="20" y="87" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Ingesta · Recuperación</text>
      <text x="20" y="107" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Evidencia del CV</text>
    </g>
  </g>

  <g transform="translate(72 701)">
    <rect width="690" height="100" rx="18" fill="#081522" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="22" y="29" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">ENTREGA CONTINUA</text>
    <text x="22" y="58" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">GitHub Actions + OIDC</text>
    <text x="22" y="80" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Frontend → S3 + invalidación CloudFront</text>
    <text x="344" y="58" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Backend → ECR → ECS</text>
    <text x="344" y="80" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Imagen versionada y despliegue estable</text>
    <path d="M 306 24 V 78" stroke="#ffffff" stroke-opacity="0.1"/>
  </g>

  <g transform="translate(1164 744)">
    <rect width="204" height="57" rx="14" fill="url(#accent)" fill-opacity="0.1" stroke="#52e0cf" stroke-opacity="0.28"/>
    <text x="102" y="25" text-anchor="middle" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Seguridad por diseño</text>
    <text x="102" y="43" text-anchor="middle" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="10">TLS · JWT · IAM · S3 privado</text>
  </g>

  <text x="72" y="856" fill="#60788a" font-family="Inter, Arial, sans-serif" font-size="11">Los datos de cada reclutador se aíslan mediante el identificador del propietario autenticado.</text>
  <text x="1368" y="856" text-anchor="end" fill="#60788a" font-family="Inter, Arial, sans-serif" font-size="11">AI Recruiter · 2026</text>
</svg>
