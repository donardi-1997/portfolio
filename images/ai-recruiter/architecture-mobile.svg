<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1500" viewBox="0 0 430 1500" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura móvil de AI Recruiter en AWS</title>
  <desc id="desc">Diagrama vertical. Los usuarios acceden por Route 53 y CloudFront. CloudFront entrega React desde S3 y envía la API al Application Load Balancer y ECS Fargate. FastAPI usa Cognito, DynamoDB, S3, Bedrock Knowledge Bases y Amazon Nova Lite. GitHub Actions automatiza el despliegue.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071422"/>
      <stop offset="1" stop-color="#0b2033"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10263b" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0c1d2f" stop-opacity="0.98"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ed7ce"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72a7ff"/>
    </marker>
  </defs>

  <rect width="430" height="1500" rx="26" fill="url(#bg)"/>
  <rect width="430" height="1500" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="428" height="1498" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <text x="28" y="48" fill="#f2f7fb" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">AI Recruiter</text>
  <text x="28" y="75" fill="#52e0cf" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ARQUITECTURA AWS</text>
  <text x="28" y="101" fill="#93a8b8" font-family="Inter, Arial, sans-serif" font-size="12">Edge · API · Datos · RAG · CI/CD</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 215 216 V 247" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 215 350 V 381" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 215 494 V 520 H 116 V 548" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 215 520 H 314 V 548" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 314 660 V 690 H 215 V 718" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 215 822 V 854 H 81 V 887" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 215 822 V 887" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 215 822 V 854 H 349 V 887" stroke="#5ed7ce" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 349 1000 V 1028 H 215 V 1067" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M 215 1180 V 1211" stroke="#72a7ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700">
    <rect x="54" y="509" width="92" height="25" rx="12" fill="#071422" stroke="#72a7ff" stroke-opacity="0.35"/>
    <text x="100" y="526" text-anchor="middle" fill="#72a7ff">RUTA /</text>
    <rect x="266" y="509" width="96" height="25" rx="12" fill="#071422" stroke="#72a7ff" stroke-opacity="0.35"/>
    <text x="314" y="526" text-anchor="middle" fill="#72a7ff">/API/*</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(50 126)">
      <rect width="330" height="90" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="44" cy="45" r="20" fill="#52e0cf" fill-opacity="0.12"/>
      <circle cx="44" cy="39" r="7" fill="none" stroke="#52e0cf" stroke-width="2"/>
      <path d="M 31 60 C 34 49 54 49 57 60" fill="none" stroke="#52e0cf" stroke-width="2"/>
      <text x="82" y="38" fill="#f2f7fb" font-size="17" font-weight="700">Usuarios</text>
      <text x="82" y="60" fill="#93a8b8" font-size="12">Navegador web</text>
    </g>

    <g transform="translate(50 260)">
      <rect width="330" height="90" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="22" y="28" fill="#f59e0b" font-size="10" font-weight="700" letter-spacing="1">DNS</text>
      <text x="22" y="56" fill="#f2f7fb" font-size="17" font-weight="700">Route 53</text>
      <text x="22" y="75" fill="#93a8b8" font-size="11">ai.adrianguerra.net</text>
    </g>

    <g transform="translate(50 394)">
      <rect width="330" height="100" rx="18" fill="url(#panel)" stroke="#52e0cf" stroke-opacity="0.42"/>
      <text x="22" y="28" fill="#52e0cf" font-size="10" font-weight="700" letter-spacing="1">EDGE</text>
      <text x="22" y="58" fill="#f2f7fb" font-size="18" font-weight="700">Amazon CloudFront</text>
      <text x="22" y="80" fill="#93a8b8" font-size="11">CDN · TLS · enrutamiento SPA y API</text>
    </g>

    <g transform="translate(26 548)">
      <rect width="180" height="112" rx="18" fill="url(#panel)" stroke="#72a7ff" stroke-opacity="0.34"/>
      <text x="18" y="27" fill="#72a7ff" font-size="9" font-weight="700" letter-spacing="1">FRONTEND</text>
      <text x="18" y="58" fill="#f2f7fb" font-size="16" font-weight="700">React + Vite</text>
      <text x="18" y="81" fill="#93a8b8" font-size="10">S3 privado · OAC</text>
      <text x="18" y="99" fill="#93a8b8" font-size="10">Archivos estáticos</text>
    </g>

    <g transform="translate(224 548)">
      <rect width="180" height="112" rx="18" fill="url(#panel)" stroke="#72a7ff" stroke-opacity="0.42"/>
      <text x="18" y="27" fill="#72a7ff" font-size="9" font-weight="700" letter-spacing="1">API ORIGIN</text>
      <text x="18" y="58" fill="#f2f7fb" font-size="15" font-weight="700">Application LB</text>
      <text x="18" y="81" fill="#93a8b8" font-size="10">HTTPS · ACM</text>
      <text x="18" y="99" fill="#93a8b8" font-size="10">Ruta /api</text>
    </g>

    <g transform="translate(50 718)">
      <rect width="330" height="104" rx="18" fill="url(#panel)" stroke="#52e0cf" stroke-opacity="0.42"/>
      <text x="22" y="28" fill="#52e0cf" font-size="10" font-weight="700" letter-spacing="1">COMPUTE</text>
      <text x="22" y="58" fill="#f2f7fb" font-size="18" font-weight="700">ECS Fargate · FastAPI</text>
      <text x="22" y="81" fill="#93a8b8" font-size="11">Python · Docker · IAM Task Role</text>
    </g>

    <g transform="translate(18 887)">
      <rect width="126" height="113" rx="17" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="26" fill="#f59e0b" font-size="9" font-weight="700">IDENTIDAD</text>
      <text x="14" y="56" fill="#f2f7fb" font-size="15" font-weight="700">Cognito</text>
      <text x="14" y="79" fill="#93a8b8" font-size="10">Login · JWT</text>
      <text x="14" y="96" fill="#93a8b8" font-size="10">Aislamiento</text>
    </g>

    <g transform="translate(152 887)">
      <rect width="126" height="113" rx="17" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="26" fill="#72a7ff" font-size="9" font-weight="700">DATOS</text>
      <text x="14" y="56" fill="#f2f7fb" font-size="15" font-weight="700">DynamoDB</text>
      <text x="14" y="79" fill="#93a8b8" font-size="10">Vacantes</text>
      <text x="14" y="96" fill="#93a8b8" font-size="10">Evaluaciones</text>
    </g>

    <g transform="translate(286 887)">
      <rect width="126" height="113" rx="17" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="26" fill="#52e0cf" font-size="9" font-weight="700">DOCUMENTOS</text>
      <text x="14" y="56" fill="#f2f7fb" font-size="15" font-weight="700">Amazon S3</text>
      <text x="14" y="79" fill="#93a8b8" font-size="10">CV en PDF</text>
      <text x="14" y="96" fill="#93a8b8" font-size="10">Metadatos</text>
    </g>

    <g transform="translate(50 1067)">
      <rect width="330" height="113" rx="18" fill="url(#panel)" stroke="#72a7ff" stroke-opacity="0.42"/>
      <text x="22" y="28" fill="#72a7ff" font-size="10" font-weight="700" letter-spacing="1">RAG</text>
      <text x="22" y="59" fill="#f2f7fb" font-size="18" font-weight="700">Bedrock Knowledge Base</text>
      <text x="22" y="82" fill="#93a8b8" font-size="11">Ingesta y recuperación de evidencia del CV</text>
    </g>

    <g transform="translate(50 1224)">
      <rect width="330" height="113" rx="18" fill="url(#panel)" stroke="#52e0cf" stroke-opacity="0.42"/>
      <text x="22" y="28" fill="#52e0cf" font-size="10" font-weight="700" letter-spacing="1">GENERACIÓN</text>
      <text x="22" y="59" fill="#f2f7fb" font-size="18" font-weight="700">Amazon Nova Lite</text>
      <text x="22" y="82" fill="#93a8b8" font-size="11">Puntajes · fortalezas · brechas explicables</text>
    </g>
  </g>

  <g transform="translate(28 1380)" font-family="Inter, Arial, sans-serif">
    <rect width="374" height="82" rx="17" fill="#081522" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="18" y="25" fill="#93a8b8" font-size="9" font-weight="700" letter-spacing="1">CI/CD · GITHUB ACTIONS + OIDC</text>
    <text x="18" y="49" fill="#f2f7fb" font-size="12" font-weight="700">Frontend → S3 + CloudFront</text>
    <text x="205" y="49" fill="#f2f7fb" font-size="12" font-weight="700">API → ECR + ECS</text>
    <text x="18" y="68" fill="#93a8b8" font-size="9">Despliegues versionados sin credenciales permanentes</text>
  </g>
</svg>
